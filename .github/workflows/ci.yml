name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Electron 下载镜像
env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  # ===============================
  # 检查版本是否变化
  # ===============================
  check_version:
    name: Check package version

    runs-on: ubuntu-latest

    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare version
        id: check
        shell: bash

        run: |

          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT


          if ! git rev-parse HEAD^ >/dev/null 2>&1
          then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi


          OLD_VERSION=$(git show HEAD^:package.json | node -p "
          JSON.parse(require('fs').readFileSync(0)).version
          ")


          echo "Old: $OLD_VERSION"
          echo "New: $CURRENT_VERSION"


          if [ "$OLD_VERSION" != "$CURRENT_VERSION" ]
          then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  # ===============================
  # 三平台构建
  # ===============================

  build:
    name: Build Electron

    needs: check_version

    # 只有版本变化才执行
    if: |
      needs.check_version.outputs.version_changed == 'true'

    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===============================
      # Windows 编译环境
      # ===============================

      - name: Setup MSVC
        if: runner.os == 'Windows'

        uses: ilammy/msvc-dev-cmd@v1

        with:
          arch: x64

      - name: Verify MSVC
        if: runner.os == 'Windows'

        shell: cmd

        run: |

          where cl

          cl

      - name: Configure node-gyp
        if: runner.os == 'Windows'

        run: |

          npm config set msvs_version 2022

      # ===============================
      # Python
      # ===============================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: '3.11'

      - name: Install setuptools

        run: pip install setuptools

      # ===============================
      # Node
      # ===============================

      - name: Setup Node

        uses: actions/setup-node@v4

        with:
          node-version: 20

          cache: npm

      # ===============================
      # Cache electron
      # ===============================

      - name: Cache Electron

        uses: actions/cache@v4

        with:
          path: |

            ~/.cache/electron

            ~/.cache/electron-builder

          key: ${{ runner.os }}-electron-cache

      # ===============================
      # Linux依赖
      # ===============================

      - name: Install Linux dependencies

        if: runner.os == 'Linux'

        run: |

          sudo apt-get update

          sudo apt-get install -y rpm fakeroot

      # ===============================
      # 安装依赖
      # ===============================

      - name: Install dependencies

        env:
          # 防止postinstall提前rebuild失败
          ELECTRON_BUILDER_SKIP_INSTALL_APP_DEPS: true

        run: |

          npm config set registry https://registry.npmjs.org

          npm ci

      # ===============================
      # 前端构建
      # ===============================

      - name: Build

        run: npm run build

      # ===============================
      # Electron打包
      # ===============================

      - name: Package Windows

        if: runner.os == 'Windows'

        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

        run: npx electron-builder --win --publish never

      - name: Package Mac

        if: runner.os == 'macOS'

        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

        run: npx electron-builder --mac --publish never

      - name: Package Linux

        if: runner.os == 'Linux'

        run: npx electron-builder \
          --linux AppImage deb \
          --publish never

      # ===============================
      # 上传产物
      # ===============================

      - name: Upload artifacts

        uses: actions/upload-artifact@v4

        with:
          name: dist-${{ runner.os }}

          path: |

            dist/**/*.exe

            dist/**/*.dmg

            dist/**/*.AppImage

            dist/**/*.deb

            dist/**/*.zip

            dist/**/*.yml

            dist/**/*.blockmap

  # =====================================================
  # Release
  # =====================================================

  release:
    name: Create Release

    needs:
      - check_version

      - build

    if: |

      github.event_name != 'pull_request' &&

      needs.check_version.outputs.version_changed == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts

        uses: actions/download-artifact@v4

        with:
          path: artifacts

      - name: Create Github Release

        uses: softprops/action-gh-release@v2

        with:
          tag_name: v${{ needs.check_version.outputs.version }}

          name: v${{ needs.check_version.outputs.version }}

          files: |

            artifacts/**/*.exe

            artifacts/**/*.dmg

            artifacts/**/*.AppImage

            artifacts/**/*.deb

            artifacts/**/*.zip

            artifacts/**/*.yml

            artifacts/**/*.blockmap

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
