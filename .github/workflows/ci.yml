name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 防止同时多个 run 互相干扰
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================
  # 检查 package.json version 是否变化
  # ==================================================
  check_version:
    runs-on: ubuntu-22.04
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version
        id: check
        shell: bash
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          OLD_VERSION=$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          echo "old=$OLD_VERSION"
          echo "new=$NEW_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  # ==================================================
  # 三平台构建
  # ==================================================
  build:
    needs: check_version
    if: needs.check_version.outputs.version_changed == 'true'
    strategy:
      matrix:
        os:
          - windows-2022
          - macos-latest
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Linux 系统依赖
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      # 安装依赖（跳过 postinstall，不需要编译原生模块）
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Vue/Electron 构建
      - name: Build
        run: npm run build

      # Electron 打包
      - name: Package Windows
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Package Mac
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Package Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb --publish never

      # 上传产物
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-dist
          path: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.zip
            dist/**/*.yml
            dist/**/*.blockmap

  # ==================================================
  # 发布 Release
  # ==================================================
  release:
    needs:
      - check_version
      - build
    if: github.event_name != 'pull_request' && needs.check_version.outputs.version_changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check_version.outputs.version }}
          name: v${{ needs.check_version.outputs.version }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.zip
            artifacts/**/*.yml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
