name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  check_version:
    runs-on: ubuntu-22.04
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "version_changed=true" >> $GITHUB_OUTPUT; exit 0
          fi
          OLD=$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          [ "$OLD" != "$V" ] && echo "version_changed=true" >> $GITHUB_OUTPUT || echo "version_changed=false" >> $GITHUB_OUTPUT

  build:
    needs: check_version
    if: needs.check_version.outputs.version_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-latest
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - run: npm ci

      - if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win -- --publish never

      - if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac -- --publish never

      - if: runner.os == 'Linux'
        run: npm run build:linux -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-dist
          path: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.zip

  release:
    needs: [check_version, build]
    if: needs.check_version.outputs.version_changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check_version.outputs.version }}
          name: v${{ needs.check_version.outputs.version }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
