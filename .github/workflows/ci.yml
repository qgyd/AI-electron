name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check_version:
    name: Check Version Changed
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package.json version
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            PREV=$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          else
            PREV=""
          fi

          if [ "$VERSION" != "$PREV" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_version
    if: needs.check_version.outputs.version_changed == 'true'
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ 核心修复：强制 node-gyp 识别 VS2022（仅 Windows）
      - name: Configure VS2022 for node-gyp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Community"
          if (Test-Path $vsPath) {
            $msvcDir = Join-Path $vsPath "VC\Tools\MSVC"
            $ver = (Get-ChildItem $msvcDir | Sort-Object Name -Descending | Select-Object -First 1).Name

            # 注入关键环境变量
            "VCToolsInstallDir=$msvcDir\$ver" >> $env:GITHUB_ENV
            "VCToolsVersion=$ver" >> $env:GITHUB_ENV
            "WindowsSdkDir=C:\Program Files (x86)\Windows Kits\10" >> $env:GITHUB_ENV

            # 全局设置 msvs_version
            npm config set msvs_version 2022 --global
            Write-Host "✅ Configured VS2022 MSVC v$ver"
          } else {
            Write-Error "VS2022 Community not found at expected path!"
            exit 1
          }

      # ✅ 固定 Python 3.11 + setuptools 解决 distutils 缺失
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        env:
          ELECTRON_BUILDER_SKIP_POSTINSTALL: true
        run: |
          sed -i.bak 's/registry.npmmirror.com/registry.npmjs.org/g' package-lock.json || true
          npm ci

      - name: Build
        run: npm run build

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npx electron-builder --win --publish never
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npx electron-builder --mac --publish never
          else
            npx electron-builder --linux AppImage deb --publish never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.zip
            dist/**/*.yml
            dist/**/*.blockmap
            !dist/**/builder-debug.yml
            !dist/**/builder-effective-config.yaml

  release:
    needs: [check_version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check_version.outputs.version }}
          name: v${{ needs.check_version.outputs.version }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
